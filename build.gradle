plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}
java{
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    // Selenium
    implementation 'org.seleniumhq.selenium:selenium-java:4.51.0'
    //implementation 'io.github.bonigarcia:webdrivermanager:5.8.1'

    // Cucumber
    implementation 'io.cucumber:cucumber-java:7.14.0'
    implementation 'io.cucumber:cucumber-junit:7.14.0'

    // JUnit 4
    testImplementation 'junit:junit:4.13.2'

    //IA
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.16.1'
}

test {
    useJUnit()
    failOnNoDiscoveredTests = false
    systemProperty 'employeeName', providers.gradleProperty('employeeName').getOrElse('')
    testLogging {
        showStandardStreams = true
    }
}